name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run portable inference tests
        run: |
          pytest -q tests/test_inference_synthetic.py
      - name: Run portable tests
        run: |
          pytest -q tests/test_inference_synthetic.py tests/test_streamlit_app.py